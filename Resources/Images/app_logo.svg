<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="smartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Glowing outer circular paths representing network connectivity -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="15 15" opacity="0.3" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="8 8" opacity="0.2" />

  <!-- Modern Smart Home Hexagonal/House Shield Icon -->
  <path d="M 256,90 L 390,170 V 340 L 256,420 L 122,340 V 170 Z" 
        fill="none" 
        stroke="url(#smartGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner House Silhouette -->
  <path d="M 256,150 L 340,215 V 330 H 172 V 215 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Smart Hub (Node in the Center) -->
  <circle cx="256" cy="260" r="24" fill="#38BDF8" opacity="0.9" />
  <circle cx="256" cy="260" r="12" fill="#FFFFFF" />

  <!-- Connection Lines -->
  <line x1="256" y1="260" x2="256" y2="150" stroke="#38BDF8" stroke-width="4" stroke-dasharray="3 3" />
  <line x1="256" y1="260" x2="200" y2="300" stroke="#38BDF8" stroke-width="4" stroke-dasharray="3 3" />
  <line x1="256" y1="260" x2="312" y2="300" stroke="#38BDF8" stroke-width="4" stroke-dasharray="3 3" />
  
  <!-- Tiny Outer Nodes -->
  <circle cx="256" cy="150" r="8" fill="#FFFFFF" />
  <circle cx="200" cy="300" r="8" fill="#FFFFFF" />
  <circle cx="312" cy="300" r="8" fill="#FFFFFF" />
</svg>
